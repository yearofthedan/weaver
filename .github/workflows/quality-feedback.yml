name: Quality Feedback

on:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 25.9.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Restore the most recent Stryker incremental cache. Save uses a
      # unique key (with run_id) so partial-progress runs always persist
      # their results for the next run to pick up.
      - name: Restore Stryker incremental cache
        uses: actions/cache/restore@v5
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-

      - name: Run mutation tests
        id: mutate
        run: pnpm test:mutate
        continue-on-error: true

      - name: Save Stryker incremental cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}

      - name: Upload mutation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: |
            reports/mutation/mutation.html
            reports/mutation/mutation.json

      - name: Post summary
        if: always()
        run: |
          if [ "${{ steps.mutate.outcome }}" == "success" ]; then
            echo "## Mutation score: above threshold" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Mutation score: below threshold ⚠️" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full report: download the \`mutation-report\` artifact." >> $GITHUB_STEP_SUMMARY

      # Triggered only when score drops below the break threshold (75).
      # Uses claude-opus-4-6 — classification and test-writing require strong code reasoning.
      # Required secrets: ANTHROPIC_API_KEY
      - name: Triage surviving mutants
        if: steps.mutate.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            /mutate-triage

            Scope: every survivor in reports/mutation/mutation.json. This run
            fell below the break threshold, which is why you were started — do
            not re-check the score, and do not stop because the project total
            looks acceptable.

            Record a noise survivor as a GitHub issue, one per group of
            survivors sharing a cause:

              gh issue create --title "Mutation survivors: <file> — <cause>" --body "<body>"

            Body: a table of line, operator, replacement and rationale, then
            "Suggested action: add to the Accepted / low-risk table in
            docs/quality.md".

            Deliver fixable work on a branch, never on main:

              1. Branch fix/mutation-$(date +%Y%m%d)-<slug>, where <slug> is the
                 most-affected source file's basename. Append -2, -3 if taken.
              2. Commit as "test: kill surviving mutants in <slug>".
              3. Push, then open a draft PR titled
                 "fix: kill surviving mutants — <slug>", whose body carries the
                 score before, the break threshold, and a table of the survivors
                 addressed with the test added for each.

            If you run out of turns before finishing, commit what you have, push,
            open the PR, and list the survivors you did not reach under a
            "Not addressed in this run" heading.
          claude_args: >-
            --model claude-opus-4-6
            --max-turns 50
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

  mutation-eval:
    name: Mutation Testing (eval harness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 25.9.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Restore the most recent Stryker eval incremental cache. Save uses a
      # unique key (with run_id) so partial-progress runs always persist
      # their results for the next run to pick up. Kept separate from the
      # src lane's cache so neither run clobbers the other's baseline.
      - name: Restore Stryker eval incremental cache
        uses: actions/cache/restore@v5
        with:
          path: reports/stryker-eval-incremental.json
          key: stryker-eval-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-eval-incremental-

      - name: Run eval harness mutation tests
        id: mutate-eval
        run: pnpm test:mutate:eval
        continue-on-error: true

      - name: Save Stryker eval incremental cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: reports/stryker-eval-incremental.json
          key: stryker-eval-incremental-${{ github.run_id }}

      - name: Upload eval mutation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-eval-report
          path: |
            reports/mutation-eval/mutation.html
            reports/mutation-eval/mutation.json

      - name: Post summary
        if: always()
        run: |
          if [ "${{ steps.mutate-eval.outcome }}" == "success" ]; then
            echo "## Eval harness mutation score: above threshold" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Eval harness mutation score: below threshold ⚠️" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full report: download the \`mutation-eval-report\` artifact." >> $GITHUB_STEP_SUMMARY
