name: Quality Feedback

on:
  push:
    branches: [main]
  workflow_dispatch:

# Runs share one incremental cache per lane. Without a group, two pushes close
# together both restore the same baseline and the later save discards the
# other's results. Queue instead of cancelling: a cancelled run never reaches
# its save step, losing everything it computed.
concurrency:
  group: quality-feedback
  cancel-in-progress: false

jobs:
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Caches saved on a branch are invisible to sibling branches, but every
      # branch can read the default branch's. Running on push to main is what
      # makes this baseline shared rather than per-ref.
      - name: Restore Stryker incremental cache
        uses: actions/cache/restore@v5
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-

      - name: Run mutation tests
        id: mutate
        run: pnpm test:mutate
        continue-on-error: true

      - name: Save Stryker incremental cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}

      # Published separately from the report so `scripts/pull-mutation-cache.sh`
      # can fetch the baseline alone. Short retention: only the newest is useful.
      - name: Upload incremental cache artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-incremental
          path: reports/stryker-incremental.json
          retention-days: 7

      - name: Upload mutation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: |
            reports/mutation/mutation.html
            reports/mutation/mutation.json

      - name: Post summary
        if: always()
        run: node scripts/mutation-summary.mjs reports/mutation/mutation.json "Src lane" >> "$GITHUB_STEP_SUMMARY"

      # The score itself does not gate: an incremental run scores only the
      # mutants the cache did not cover, so comparing that subset to a
      # project-wide threshold is meaningless. A run that produced no report at
      # all is a real breakage and does fail the job.
      - name: Fail if the run produced no report
        if: always()
        run: test -f reports/mutation/mutation.json

  mutation-eval:
    name: Mutation Testing (eval harness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Restore Stryker eval incremental cache
        uses: actions/cache/restore@v5
        with:
          path: reports/stryker-eval-incremental.json
          key: stryker-eval-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-eval-incremental-

      - name: Run eval harness mutation tests
        id: mutate-eval
        run: pnpm test:mutate:eval
        continue-on-error: true

      - name: Save Stryker eval incremental cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: reports/stryker-eval-incremental.json
          key: stryker-eval-incremental-${{ github.run_id }}

      - name: Upload eval incremental cache artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-eval-incremental
          path: reports/stryker-eval-incremental.json
          retention-days: 7

      - name: Upload eval mutation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-eval-report
          path: |
            reports/mutation-eval/mutation.html
            reports/mutation-eval/mutation.json

      - name: Post summary
        if: always()
        run: node scripts/mutation-summary.mjs reports/mutation-eval/mutation.json "Eval harness" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the run produced no report
        if: always()
        run: test -f reports/mutation-eval/mutation.json
