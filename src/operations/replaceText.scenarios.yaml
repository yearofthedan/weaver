fixtures:
  a-marker-file:
    description: a tsconfig and one source file holding a literal MARKER at line 1, col 15
    files:
      tsconfig.json: |
        {
          "compilerOptions": { "strict": true },
          "include": ["src/**/*.ts"]
        }
      src/lib.ts: |
        const value = MARKER;

scenarios:
  - name: resolves a relative edit path against the workspace root
    description: >
      `edits[].file` is a path param nested inside an array, so it is resolved against the
      workspace root: `src/lib.ts` names `<root>/src/lib.ts`, whatever the process cwd is, and
      the write lands on that file.
    given: a-marker-file
    when:
      - replaceText:
          edits:
            - { file: src/lib.ts, line: 1, col: 15, oldText: MARKER, newText: "1" }
    then:
      response:
        status: success
        filesModified: [src/lib.ts]
        replacementCount: 1
        typeErrors: none
      files:
        changed:
          src/lib.ts: |
            const value = 1;
        unchanged: [tsconfig.json]

  - name: collapses two relative edits naming the same file into one write
    given:
      extends: a-marker-file
      files:
        src/lib.ts: |
          const first = MARKER;
          const second = MARKER_TWO;
    when:
      - replaceText:
          edits:
            - { file: src/lib.ts, line: 1, col: 15, oldText: MARKER, newText: "1" }
            - { file: src/lib.ts, line: 2, col: 16, oldText: MARKER_TWO, newText: "2" }
    then:
      response:
        status: success
        filesModified: [src/lib.ts]
        replacementCount: 2
        typeErrors: none
      files:
        changed:
          src/lib.ts: |
            const first = 1;
            const second = 2;
        unchanged: [tsconfig.json]

  - name: an empty edits array is a no-op
    given: a-marker-file
    when:
      - replaceText: { edits: [] }
    then:
      response:
        status: success
        filesModified: []
        replacementCount: 0
      files:
        unchanged: [tsconfig.json, src/lib.ts]