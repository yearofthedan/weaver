fixtures:
  a-marker-file:
    description: a tsconfig and one source file holding a literal MARKER at line 1, col 15
    files:
      tsconfig.json: |
        {
          "compilerOptions": { "strict": true },
          "include": ["src/**/*.ts"]
        }
      src/lib.ts: |
        const value = MARKER;

  a-vue-project-scoping-to-src-with-an-out-of-program-marker-file:
    description: >
      A Vue tsconfig whose include reaches only src/, with an SFC under src/ making the workspace a
      Vue project, and a file under dist/ holding a literal MARKER at line 1, col 26. dist/ is in
      neither seed of the Volar program — the tsconfig's file set and the workspace walk, which
      skips dist/ — so the check that runs after a write has to add the written file on demand.
    files:
      tsconfig.json: |
        {
          "compilerOptions": {
            "strict": true,
            "target": "ESNext",
            "module": "ESNext",
            "moduleResolution": "bundler",
            "jsx": "preserve",
            "noEmit": true
          },
          "include": ["src/**/*"]
        }
      src/App.vue: |
        <script setup lang="ts">
        </script>

        <template>
          <div>App</div>
        </template>
      dist/gen.ts: |
        export const n: number = MARKER;

  a-ts-only-project-scoping-to-src-with-an-out-of-program-marker-file:
    description: >
      The same tsconfig and the same dist/ file with no .vue file anywhere in the workspace, so the
      post-write check runs on the ts-morph engine instead of Volar.
    files:
      tsconfig.json: |
        {
          "compilerOptions": {
            "strict": true,
            "target": "ESNext",
            "module": "ESNext",
            "moduleResolution": "bundler",
            "jsx": "preserve",
            "noEmit": true
          },
          "include": ["src/**/*"]
        }
      dist/gen.ts: |
        export const n: number = MARKER;

scenarios:
  - name: resolves a relative edit path against the workspace root
    description: >
      `edits[].file` is a path param nested inside an array, so it is resolved against the
      workspace root: `src/lib.ts` names `<root>/src/lib.ts`, whatever the process cwd is, and
      the write lands on that file.
    given: a-marker-file
    when:
      - replaceText:
          edits:
            - { file: src/lib.ts, line: 1, col: 15, oldText: MARKER, newText: "1" }
    then:
      response:
        status: success
        filesModified: [src/lib.ts]
        replacementCount: 1
        typeErrors: none
      files:
        changed:
          src/lib.ts: |
            const value = 1;
        unchanged: [tsconfig.json]

  - name: applies two edits to the same file
    given:
      extends: a-marker-file
      files:
        src/lib.ts: |
          const first = MARKER;
          const second = MARKER_TWO;
    when:
      - replaceText:
          edits:
            - { file: src/lib.ts, line: 1, col: 15, oldText: MARKER, newText: "1" }
            - { file: src/lib.ts, line: 2, col: 16, oldText: MARKER_TWO, newText: "2" }
    then:
      response:
        status: success
        filesModified: [src/lib.ts]
        replacementCount: 2
        typeErrors: none
      files:
        changed:
          src/lib.ts: |
            const first = 1;
            const second = 2;
        unchanged: [tsconfig.json]

  - name: an empty edits array is a no-op
    given: a-marker-file
    when:
      - replaceText: { edits: [] }
    then:
      response:
        status: success
        filesModified: []
        replacementCount: 0
      files:
        unchanged: [tsconfig.json, src/lib.ts]

  - name: a surgical write outside the program reports the type error it introduced
    description: >
      dist/gen.ts is outside the tsconfig's include and inside dist/, which the workspace walk
      skips, so the Volar program does not hold it and the check after the write has to add it on
      demand. Without that the response would be status success with typeErrorCount 0 for a write
      that no longer compiles — the same answer a caller gets for a write that was checked and
      found clean, which is the whole question the post-write check exists to answer.
    given: a-vue-project-scoping-to-src-with-an-out-of-program-marker-file
    when:
      - replaceText:
          edits:
            - { file: dist/gen.ts, line: 1, col: 26, oldText: MARKER, newText: '"x"' }
    then:
      response:
        status: warn
        filesModified: [dist/gen.ts]
        replacementCount: 1
        typeErrors:
          - file: dist/gen.ts
            line: 1
            col: 14
            code: 2322
            message: "Type 'string' is not assignable to type 'number'."
        typeErrorCount: 1
        typeErrorsTruncated: false
      files:
        changed:
          dist/gen.ts: |
            export const n: number = "x";
        unchanged: [tsconfig.json, src/App.vue]

  - name: the same surgical write outside the program reports the same type error in a TS-only workspace
    description: >
      The identical write and tsconfig with no .vue file anywhere, so the post-write check runs on
      the ts-morph engine instead of Volar. Same warn status and same diagnostic as the Vue case:
      the ts-morph engine already added the written file to its program on demand, so this pins
      that the post-write answer converges between the engines rather than being Vue-only
      behaviour.
    given: a-ts-only-project-scoping-to-src-with-an-out-of-program-marker-file
    when:
      - replaceText:
          edits:
            - { file: dist/gen.ts, line: 1, col: 26, oldText: MARKER, newText: '"x"' }
    then:
      response:
        status: warn
        filesModified: [dist/gen.ts]
        replacementCount: 1
        typeErrors:
          - file: dist/gen.ts
            line: 1
            col: 14
            code: 2322
            message: "Type 'string' is not assignable to type 'number'."
        typeErrorCount: 1
        typeErrorsTruncated: false
      files:
        changed:
          dist/gen.ts: |
            export const n: number = "x";
        unchanged: [tsconfig.json]