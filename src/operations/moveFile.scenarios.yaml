# Fixtures name the workspace state a scenario starts from, on the one axis a move turns
# on: who imports the file being moved. Depth stops at one hop past the tsconfig — a
# scenario needing a third layer inlines its files instead, so the input a `then` block
# depends on stays visible in the scenario itself.
fixtures:
  a-ts-project:
    description: a tsconfig file including src
    files:
      tsconfig.json: |
        {
          "compilerOptions": { "strict": true },
          "include": ["src/**/*.ts"]
        }

  a-utils-module:
    description: an exported utility at src/utils.ts, with no importers of its own
    extends: a-ts-project
    files:
      src/utils.ts: |
        export function greetUser(name: string): string {
          return `Hello, ${name}`;
        }

  a-utils-module-with-importers:
    description: an exported utility, imported once from src and once from an out-of-project test
    extends: a-ts-project
    files:
      src/utils.ts: |
        export function greetUser(name: string): string {
          return `Hello, ${name}`;
        }
      src/main.ts: |
        import { greetUser } from "./utils";

        console.log(greetUser("World"));
      tests/utils.test.ts: |
        import { greetUser } from "../src/utils";

        console.log(greetUser("Test"));

  a-vue-project:
    description: a Vue SFC and a composable it imports, alongside a plain TS entry point
    files:
      tsconfig.json: |
        {
          "compilerOptions": {
            "strict": true,
            "target": "ESNext",
            "module": "ESNext",
            "moduleResolution": "bundler",
            "jsx": "preserve"
          },
          "include": ["src/**/*.ts", "src/**/*.vue"]
        }
      src/composables/useCounter.ts: |
        export function useCounter(initialValue = 0) {
          let count = initialValue;
          return {
            count: () => count,
            increment: () => {
              count++;
            },
          };
        }
      src/App.vue: |
        <script setup lang="ts">
        import { useCounter } from "./composables/useCounter";

        const counter = useCounter(0);
        </script>

        <template>
          <div>{{ counter.count() }}</div>
        </template>
      src/main.ts: |
        import { useCounter } from "./composables/useCounter";

        const _counter = useCounter(0);

scenarios:
  - name: moves a file and repoints every importer
    given: a-utils-module-with-importers
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [src/main.ts, tests/utils.test.ts, lib/utils.ts]
        filesSkipped: []
        oldPath: src/utils.ts
        newPath: lib/utils.ts
      files:
        moved:
          src/utils.ts: lib/utils.ts
        changed:
          src/main.ts: |
            import { greetUser } from "../lib/utils";

            console.log(greetUser("World"));
          tests/utils.test.ts: |
            import { greetUser } from "../lib/utils";

            console.log(greetUser("Test"));

  - name: creates missing destination directories on the way
    given: a-utils-module-with-importers
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: deep/nested/lib/utils.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [src/main.ts, tests/utils.test.ts, deep/nested/lib/utils.ts]
        filesSkipped: []
        oldPath: src/utils.ts
        newPath: deep/nested/lib/utils.ts
      files:
        moved:
          src/utils.ts: deep/nested/lib/utils.ts
        changed:
          src/main.ts: |
            import { greetUser } from "../deep/nested/lib/utils";

            console.log(greetUser("World"));
          tests/utils.test.ts: |
            import { greetUser } from "../deep/nested/lib/utils";

            console.log(greetUser("Test"));

  - name: leaves an importer of a similarly-named file alone
    given:
      description: a second utility whose name has the moved file's name as a prefix
      extends: a-utils-module
      files:
        src/my-utils.ts: |
          export function myHelper() { return 42; }
        src/consumer.ts: |
          import { myHelper } from "./my-utils";
          export { myHelper };
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [lib/utils.ts]
        filesSkipped: []
        oldPath: src/utils.ts
        newPath: lib/utils.ts
      files:
        moved:
          src/utils.ts: lib/utils.ts
        unchanged:
          - src/consumer.ts
          - src/my-utils.ts

  - name: leaves a .js specifier alone when a real .js file sits beside the moved one
    given:
      description: a hand-written utils.js next to utils.ts, imported with a .js specifier
      extends: a-utils-module
      files:
        src/utils.js: |
          // this is an actual JS file
          export function greetUser(name) { return "Hello, " + name; }
        src/jsConsumer.ts: |
          import { greetUser } from "./utils.js";
          export { greetUser };
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [lib/utils.ts]
        filesSkipped: []
        oldPath: src/utils.ts
        newPath: lib/utils.ts
      files:
        moved:
          src/utils.ts: lib/utils.ts
        unchanged:
          - src/jsConsumer.ts
          - src/utils.js

  - name: rewrites the import without disturbing a comment that names both paths
    given:
      description: an out-of-project test whose comment names both the old and the new path
      extends: a-utils-module
      files:
        tests/import-with-comment.ts: |
          // TODO: migrate logic from ../src/utils to ../lib/utils
          import { greetUser } from "../src/utils";

          console.log(greetUser('test'));
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [tests/import-with-comment.ts, lib/utils.ts]
        filesSkipped: []
        oldPath: src/utils.ts
        newPath: lib/utils.ts
      files:
        moved:
          src/utils.ts: lib/utils.ts
        changed:
          tests/import-with-comment.ts: |
            // TODO: migrate logic from ../src/utils to ../lib/utils
            import { greetUser } from "../lib/utils";

            console.log(greetUser('test'));

  - name: refuses to move a file that does not exist, leaving the workspace alone
    given: a-utils-module
    when:
      - moveFile: { oldPath: src/missing.ts, newPath: lib/missing.ts }
    then:
      response:
        status: error
        error: FILE_NOT_FOUND
        message: "File not found: src/missing.ts"

  - name: a later move uses project state the earlier move updated
    description: >
      The daemon keeps one compiler across calls, so the second move must see that the
      first one relocated its dependency. A project still holding the old src/utils.ts
      computes edit offsets against text that no longer matches disk, splicing the
      import into nonsense like ../src/utilsutils.

      checkTypeErrors is off deliberately. Collecting diagnostics reloads every modified
      file, which repairs an incoherent project as a side effect and hides this class of
      fault; with it off, the move has to keep its own state straight.
    given:
      extends: a-utils-module
      files:
        src/main.ts: |
          import { greetUser } from "./utils";

          console.log(greetUser("World"));
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts, checkTypeErrors: false }
      - moveFile: { oldPath: src/main.ts, newPath: dist/main.ts, checkTypeErrors: false }
    then:
      files:
        moved:
          src/utils.ts: lib/utils.ts
          src/main.ts:
            to: dist/main.ts
            content: |
              import { greetUser } from "../lib/utils";

              console.log(greetUser("World"));
        unchanged: [tsconfig.json]

  - name: rewrites the moved file's own relative import to keep pointing at the same target
    given:
      extends: a-utils-module
      files:
        tests/utils.test.ts: |
          import { greetUser } from "../src/utils";

          console.log(greetUser("Test"));
    when:
      - moveFile: { oldPath: tests/utils.test.ts, newPath: tests/unit/utils.test.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [tests/utils.test.ts, tests/unit/utils.test.ts]
        filesSkipped: []
        oldPath: tests/utils.test.ts
        newPath: tests/unit/utils.test.ts
      files:
        moved:
          tests/utils.test.ts:
            to: tests/unit/utils.test.ts
            content: |
              import { greetUser } from "../../src/utils";

              console.log(greetUser("Test"));

  - name: leaves a bare module specifier alone while rewriting the relative one beside it
    given:
      extends: a-utils-module
      files:
        tests/mixed.test.ts: |
          import { describe } from "vitest";
          import { greetUser } from "../src/utils";
    when:
      - moveFile: { oldPath: tests/mixed.test.ts, newPath: tests/unit/mixed.test.ts }
    then:
      response:
        status: warn
        filesModified: [tests/mixed.test.ts, tests/unit/mixed.test.ts]
        filesSkipped: []
        oldPath: tests/mixed.test.ts
        newPath: tests/unit/mixed.test.ts
        typeErrorCount: 1
        typeErrorsTruncated: false
        typeErrors:
          - file: tests/unit/mixed.test.ts
            line: 1
            col: 26
            code: 2307
            message: "Cannot find module 'vitest' or its corresponding type declarations."
      files:
        moved:
          tests/mixed.test.ts:
            to: tests/unit/mixed.test.ts
            content: |
              import { describe } from "vitest";
              import { greetUser } from "../../src/utils";

  - name: keeps the .js extension when rewriting the moved file's own import
    given:
      extends: a-utils-module
      files:
        tests/js-ext.test.ts: |
          import { greetUser } from "../src/utils.js";
    when:
      - moveFile: { oldPath: tests/js-ext.test.ts, newPath: tests/unit/js-ext.test.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [tests/js-ext.test.ts, tests/unit/js-ext.test.ts]
        filesSkipped: []
        oldPath: tests/js-ext.test.ts
        newPath: tests/unit/js-ext.test.ts
      files:
        moved:
          tests/js-ext.test.ts:
            to: tests/unit/js-ext.test.ts
            content: |
              import { greetUser } from "../../src/utils.js";

  - name: leaves the moved file's imports alone when the rename stays at the same depth
    given:
      extends: a-utils-module
      files:
        tests/renamed.test.ts: |
          import { greetUser } from "../src/utils";
    when:
      - moveFile: { oldPath: tests/renamed.test.ts, newPath: tests/other.test.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [tests/other.test.ts]
        filesSkipped: []
        oldPath: tests/renamed.test.ts
        newPath: tests/other.test.ts
      files:
        moved:
          tests/renamed.test.ts: tests/other.test.ts

  - name: rewrites the .js specifier when the tsconfig resolves modules the node way
    description: >
      Under moduleResolution node a ./utils.js specifier resolves to utils.ts, so the
      move has to rewrite it rather than leave it as an unresolved literal.
    given:
      files:
        tsconfig.json: |
          {
            "compilerOptions": { "strict": true, "moduleResolution": "node" },
            "include": ["src/**/*.ts"]
          }
        src/utils.ts: |
          export function greetUser(name: string): string {
            return `Hello, ${name}`;
          }
        src/consumer.ts: |
          import { greetUser } from "./utils.js";

          export { greetUser };
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [src/consumer.ts, lib/utils.ts]
        filesSkipped: []
        oldPath: src/utils.ts
        newPath: lib/utils.ts
      files:
        moved:
          src/utils.ts: lib/utils.ts
        changed:
          src/consumer.ts: |
            import { greetUser } from "../lib/utils.js";

            export { greetUser };

  - name: moving a file back restores the importer to its original specifier
    given: a-utils-module-with-importers
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
      - moveFile: { oldPath: lib/utils.ts, newPath: src/utils.ts }
    then:
      files:
        unchanged: [tsconfig.json, src/utils.ts, src/main.ts, tests/utils.test.ts]

  - name: two out-of-project files move in turn and the importer follows both
    given:
      extends: a-ts-project
      files:
        tests/helper.ts: |
          export function help(): number {
            return 42;
          }
        tests/consumer.test.ts: |
          import { help } from "./helper";

          console.log(help());
    when:
      - moveFile: { oldPath: tests/helper.ts, newPath: lib/helper.ts }
      - moveFile: { oldPath: tests/consumer.test.ts, newPath: tests/unit/consumer.test.ts }
    then:
      files:
        moved:
          tests/helper.ts: lib/helper.ts
          tests/consumer.test.ts:
            to: tests/unit/consumer.test.ts
            content: |
              import { help } from "../../lib/helper";

              console.log(help());
        unchanged: [tsconfig.json]

  - name: the fallback scan repoints an out-of-project importer on the second move
    given:
      extends: a-utils-module
      files:
        src/main.ts: |
          import { greetUser } from "./utils";

          export { greetUser };
        scripts/run.ts: |
          import { greetUser } from "../src/main";

          console.log(greetUser("world"));
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
      - moveFile: { oldPath: src/main.ts, newPath: dist/main.ts }
    then:
      files:
        moved:
          src/utils.ts: lib/utils.ts
          src/main.ts:
            to: dist/main.ts
            content: |
              import { greetUser } from "../lib/utils";

              export { greetUser };
        changed:
          scripts/run.ts: |
            import { greetUser } from "../dist/main";

            console.log(greetUser("world"));

  - name: repoints a Vue SFC import when the composable it uses moves
    description: >
      The SFC's specifier gains a .js extension it did not have. Vue imports are
      repointed by regex scan rather than the language service, and that path builds
      the new specifier with computeRelativeImportPath, which always emits .js for a
      .ts target. Under moduleResolution bundler both forms resolve, so nothing fails
      — the scenario states the extension to keep the rewrite visible rather than
      approving it silently.
    given: a-vue-project
    when:
      - moveFile: { oldPath: src/composables/useCounter.ts, newPath: src/utils/useCounter.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [src/main.ts, src/utils/useCounter.ts, src/App.vue]
        filesSkipped: []
        oldPath: src/composables/useCounter.ts
        newPath: src/utils/useCounter.ts
      files:
        moved:
          src/composables/useCounter.ts: src/utils/useCounter.ts
        changed:
          src/App.vue: |
            <script setup lang="ts">
            import { useCounter } from "./utils/useCounter.js";

            const counter = useCounter(0);
            </script>

            <template>
              <div>{{ counter.count() }}</div>
            </template>
          src/main.ts: |
            import { useCounter } from "./utils/useCounter";

            const _counter = useCounter(0);

  - name: moving the composable back restores the SFC import
    description: >
      The TS round-trip leaves every file byte-identical. This one does not: the SFC
      comes back pointing at its original directory but keeps the .js extension the
      first move introduced, so the import is listed as changed rather than unchanged.
    given: a-vue-project
    when:
      - moveFile: { oldPath: src/composables/useCounter.ts, newPath: src/utils/useCounter.ts }
      - moveFile: { oldPath: src/utils/useCounter.ts, newPath: src/composables/useCounter.ts }
    then:
      files:
        unchanged: [tsconfig.json, src/composables/useCounter.ts, src/main.ts]
        changed:
          src/App.vue: |
            <script setup lang="ts">
            import { useCounter } from "./composables/useCounter.js";

            const counter = useCounter(0);
            </script>

            <template>
              <div>{{ counter.count() }}</div>
            </template>

  - name: rewrites the moved test's own imports while leaving its bare specifier alone
    given:
      extends: a-vue-project
      files:
        tests/unit/counter.test.ts: |
          import { describe, expect, it } from "vitest";
          import { useCounter } from "../../src/composables/useCounter";

          describe("counter", () => {
            it("increments", () => {
              const c = useCounter();
              c.increment();
              expect(c.count()).toBe(1);
            });
          });
    when:
      - moveFile: { oldPath: tests/unit/counter.test.ts, newPath: src/counter.test.ts }
    then:
      response:
        status: warn
        filesModified: [tests/unit/counter.test.ts, src/counter.test.ts]
        filesSkipped: []
        oldPath: tests/unit/counter.test.ts
        newPath: src/counter.test.ts
        typeErrorCount: 1
        typeErrorsTruncated: false
        typeErrors:
          - file: src/counter.test.ts
            line: 1
            col: 38
            code: 2307
            message: "Cannot find module 'vitest' or its corresponding type declarations."
      files:
        moved:
          tests/unit/counter.test.ts:
            to: src/counter.test.ts
            content: |
              import { describe, expect, it } from "vitest";
              import { useCounter } from "./composables/useCounter";

              describe("counter", () => {
                it("increments", () => {
                  const c = useCounter();
                  c.increment();
                  expect(c.count()).toBe(1);
                });
              });

  - name: repoints an out-of-project test when the composable it imports moves
    given:
      extends: a-vue-project
      files:
        tests/unit/counter.test.ts: |
          import { useCounter } from "../../src/composables/useCounter";

          console.log(useCounter(0).count());
    when:
      - moveFile: { oldPath: src/composables/useCounter.ts, newPath: src/utils/useCounter.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [src/main.ts, tests/unit/counter.test.ts, src/utils/useCounter.ts, src/App.vue]
        filesSkipped: []
        oldPath: src/composables/useCounter.ts
        newPath: src/utils/useCounter.ts
      files:
        moved:
          src/composables/useCounter.ts: src/utils/useCounter.ts
        changed:
          src/App.vue: |
            <script setup lang="ts">
            import { useCounter } from "./utils/useCounter.js";

            const counter = useCounter(0);
            </script>

            <template>
              <div>{{ counter.count() }}</div>
            </template>
          src/main.ts: |
            import { useCounter } from "./utils/useCounter";

            const _counter = useCounter(0);
          tests/unit/counter.test.ts: |
            import { useCounter } from "../../src/utils/useCounter";

            console.log(useCounter(0).count());

  - name: refuses to move a file that does not exist in a Vue project
    given: a-vue-project
    when:
      - moveFile: { oldPath: src/missing.ts, newPath: src/utils/missing.ts }
    then:
      response:
        status: error
        error: FILE_NOT_FOUND
        message: "File not found: src/missing.ts"

  - name: repoints an SFC's .js specifier away from the real .js file sitting beside the moved composable
    description: >
      The TypeScript path leaves this specifier alone: ./composables/useCounter.js names
      a hand-written JS file that did not move, so rewriting it would be wrong. The Vue
      scan has no such guard and repoints it at the moved TypeScript file, which is a
      different module from the one the SFC was importing.

      Nothing reports the change. Under moduleResolution bundler the new specifier
      resolves to useCounter.ts, so the response is a clean success with no type errors
      while the meaning of the import has moved. Pinned to keep that visible; the sibling
      TS scenario states the behaviour this one should have had.
    given:
      description: a hand-written useCounter.js beside the composable, imported with a .js specifier from the SFC
      extends: a-vue-project
      files:
        src/composables/useCounter.js: |
          // this is an actual JS file
          export function useCounter(initial) {
            return { count: () => initial };
          }
        src/App.vue: |
          <script setup lang="ts">
          import { useCounter } from "./composables/useCounter.js";

          const counter = useCounter(0);
          </script>

          <template>
            <div>{{ counter.count() }}</div>
          </template>
    when:
      - moveFile: { oldPath: src/composables/useCounter.ts, newPath: src/utils/useCounter.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [src/main.ts, src/utils/useCounter.ts, src/App.vue]
        filesSkipped: []
        oldPath: src/composables/useCounter.ts
        newPath: src/utils/useCounter.ts
      files:
        moved:
          src/composables/useCounter.ts: src/utils/useCounter.ts
        changed:
          src/App.vue: |
            <script setup lang="ts">
            import { useCounter } from "./utils/useCounter.js";

            const counter = useCounter(0);
            </script>

            <template>
              <div>{{ counter.count() }}</div>
            </template>
          src/main.ts: |
            import { useCounter } from "./utils/useCounter";

            const _counter = useCounter(0);
        unchanged:
          - src/composables/useCounter.js

  - name: follows the moved file through an @ path alias
    given:
      description: a project mapping @/* onto src/*, with the importer using the alias
      files:
        tsconfig.json: |
          {
            "compilerOptions": {
              "strict": true,
              "baseUrl": ".",
              "paths": { "@/*": ["src/*"] }
            },
            "include": ["src/**/*.ts"]
          }
        src/utils.ts: |
          export function greetUser(name: string): string {
            return `Hello, ${name}`;
          }
        src/main.ts: |
          import { greetUser } from "@/utils";

          console.log(greetUser("World"));
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: src/lib/utils.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [src/main.ts, src/lib/utils.ts]
        filesSkipped: []
        oldPath: src/utils.ts
        newPath: src/lib/utils.ts
      files:
        moved:
          src/utils.ts: src/lib/utils.ts
        changed:
          src/main.ts: |
            import { greetUser } from "@/lib/utils";

            console.log(greetUser("World"));

  - name: leaves an SFC's aliased import pointing at the composable's old location
    description: >
      The TypeScript path follows an @ alias correctly, because the language service
      resolves it. The Vue scan matches specifiers with a regex that requires a leading
      ./ or ../, so an aliased import is never considered and the SFC keeps pointing at
      a path that no longer exists.

      Nothing reports it. App.vue is not written, so it never enters filesModified, and
      the post-write type check only looks at the files that array names — the one broken
      file is the one file excluded from the check. The caller gets status success with
      an error count of zero.

      An @/* alias onto src/* is what the Vue and Vite scaffolds generate, so this is the
      default project shape rather than an unusual one. Pinned as it behaves today.
    given:
      description: a Vue project mapping @/* onto src/*, with the SFC importing through the alias
      files:
        tsconfig.json: |
          {
            "compilerOptions": {
              "strict": true,
              "target": "ESNext",
              "module": "ESNext",
              "moduleResolution": "bundler",
              "jsx": "preserve",
              "baseUrl": ".",
              "paths": { "@/*": ["src/*"] }
            },
            "include": ["src/**/*.ts", "src/**/*.vue"]
          }
        src/composables/useCounter.ts: |
          export function useCounter(initialValue = 0) {
            return { count: () => initialValue };
          }
        src/App.vue: |
          <script setup lang="ts">
          import { useCounter } from "@/composables/useCounter";

          const counter = useCounter(0);
          </script>

          <template>
            <div>{{ counter.count() }}</div>
          </template>
    when:
      - moveFile: { oldPath: src/composables/useCounter.ts, newPath: src/utils/useCounter.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [src/utils/useCounter.ts]
        filesSkipped: []
        oldPath: src/composables/useCounter.ts
        newPath: src/utils/useCounter.ts
