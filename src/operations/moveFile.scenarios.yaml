# Fixtures name the workspace state a scenario starts from, on the one axis a move turns
# on: who imports the file being moved. Depth stops at one hop past the tsconfig — a
# scenario needing a third layer inlines its files instead, so the input a `then` block
# depends on stays visible in the scenario itself.
fixtures:
  ts-project:
    description: a tsconfig file including src
    files:
      tsconfig.json: |
        {
          "compilerOptions": { "strict": true },
          "include": ["src/**/*.ts"]
        }

  module-nobody-imports:
    description: an exported utility with no importers anywhere in the workspace
    extends: ts-project
    files:
      src/utils.ts: |
        export function greetUser(name: string): string {
          return `Hello, ${name}`;
        }

  module-with-importers:
    description: the same utility, imported once from src and once from an out-of-project test
    extends: ts-project
    files:
      src/utils.ts: |
        export function greetUser(name: string): string {
          return `Hello, ${name}`;
        }
      src/main.ts: |
        import { greetUser } from "./utils";

        console.log(greetUser("World"));
      tests/utils.test.ts: |
        import { greetUser } from "../src/utils";

        console.log(greetUser("Test"));

scenarios:
  - name: moves a file and repoints every importer
    given: module-with-importers
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [src/main.ts, tests/utils.test.ts, lib/utils.ts]
        filesSkipped: []
        oldPath: src/utils.ts
        newPath: lib/utils.ts
      files:
        moved:
          src/utils.ts: lib/utils.ts
        changed:
          src/main.ts: |
            import { greetUser } from "../lib/utils";

            console.log(greetUser("World"));
          tests/utils.test.ts: |
            import { greetUser } from "../lib/utils";

            console.log(greetUser("Test"));

  - name: creates missing destination directories on the way
    given: module-with-importers
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: deep/nested/lib/utils.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [src/main.ts, tests/utils.test.ts, deep/nested/lib/utils.ts]
        filesSkipped: []
        oldPath: src/utils.ts
        newPath: deep/nested/lib/utils.ts
      files:
        moved:
          src/utils.ts: deep/nested/lib/utils.ts
        changed:
          src/main.ts: |
            import { greetUser } from "../deep/nested/lib/utils";

            console.log(greetUser("World"));
          tests/utils.test.ts: |
            import { greetUser } from "../deep/nested/lib/utils";

            console.log(greetUser("Test"));

  - name: leaves an importer of a similarly-named file alone
    given:
      description: a second utility whose name has the moved file's name as a prefix
      extends: module-nobody-imports
      files:
        src/my-utils.ts: |
          export function myHelper() { return 42; }
        src/consumer.ts: |
          import { myHelper } from "./my-utils";
          export { myHelper };
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [lib/utils.ts]
        filesSkipped: []
        oldPath: src/utils.ts
        newPath: lib/utils.ts
      files:
        moved:
          src/utils.ts: lib/utils.ts
        unchanged:
          - src/consumer.ts
          - src/my-utils.ts

  - name: leaves a .js specifier alone when a real .js file sits beside the moved one
    given:
      description: a hand-written utils.js next to utils.ts, imported with a .js specifier
      extends: module-nobody-imports
      files:
        src/utils.js: |
          // this is an actual JS file
          export function greetUser(name) { return "Hello, " + name; }
        src/jsConsumer.ts: |
          import { greetUser } from "./utils.js";
          export { greetUser };
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [lib/utils.ts]
        filesSkipped: []
        oldPath: src/utils.ts
        newPath: lib/utils.ts
      files:
        moved:
          src/utils.ts: lib/utils.ts
        unchanged:
          - src/jsConsumer.ts
          - src/utils.js

  - name: rewrites the import without disturbing a comment that names both paths
    given:
      description: an out-of-project test whose comment names both the old and the new path
      extends: module-nobody-imports
      files:
        tests/import-with-comment.ts: |
          // TODO: migrate logic from ../src/utils to ../lib/utils
          import { greetUser } from "../src/utils";

          console.log(greetUser('test'));
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [tests/import-with-comment.ts, lib/utils.ts]
        filesSkipped: []
        oldPath: src/utils.ts
        newPath: lib/utils.ts
      files:
        moved:
          src/utils.ts: lib/utils.ts
        changed:
          tests/import-with-comment.ts: |
            // TODO: migrate logic from ../src/utils to ../lib/utils
            import { greetUser } from "../lib/utils";

            console.log(greetUser('test'));

  - name: refuses to move a file that does not exist, leaving the workspace alone
    given: module-nobody-imports
    when:
      - moveFile: { oldPath: src/missing.ts, newPath: lib/missing.ts }
    then:
      response:
        status: error
        error: FILE_NOT_FOUND
        message: "File not found: src/missing.ts"

  - name: a later move uses project state the earlier move updated
    description: >
      The daemon keeps one compiler across calls, so the second move must see that the
      first one relocated its dependency. A project still holding the old src/utils.ts
      computes edit offsets against text that no longer matches disk, splicing the
      import into nonsense like ../src/utilsutils.

      checkTypeErrors is off deliberately. Collecting diagnostics reloads every modified
      file, which repairs an incoherent project as a side effect and hides this class of
      fault; with it off, the move has to keep its own state straight.
    given:
      extends: module-nobody-imports
      files:
        src/main.ts: |
          import { greetUser } from "./utils";

          console.log(greetUser("World"));
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts, checkTypeErrors: false }
      - moveFile: { oldPath: src/main.ts, newPath: dist/main.ts, checkTypeErrors: false }
    then:
      files:
        moved:
          src/utils.ts: lib/utils.ts
          src/main.ts:
            to: dist/main.ts
            content: |
              import { greetUser } from "../lib/utils";

              console.log(greetUser("World"));
        unchanged: [tsconfig.json]

  - name: rewrites the moved file's own relative import to keep pointing at the same target
    given:
      extends: module-nobody-imports
      files:
        tests/utils.test.ts: |
          import { greetUser } from "../src/utils";

          console.log(greetUser("Test"));
    when:
      - moveFile: { oldPath: tests/utils.test.ts, newPath: tests/unit/utils.test.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [tests/utils.test.ts, tests/unit/utils.test.ts]
        filesSkipped: []
        oldPath: tests/utils.test.ts
        newPath: tests/unit/utils.test.ts
      files:
        moved:
          tests/utils.test.ts:
            to: tests/unit/utils.test.ts
            content: |
              import { greetUser } from "../../src/utils";

              console.log(greetUser("Test"));

  - name: leaves a bare module specifier alone while rewriting the relative one beside it
    given:
      extends: module-nobody-imports
      files:
        tests/mixed.test.ts: |
          import { describe } from "vitest";
          import { greetUser } from "../src/utils";
    when:
      - moveFile: { oldPath: tests/mixed.test.ts, newPath: tests/unit/mixed.test.ts }
    then:
      response:
        status: warn
        filesModified: [tests/mixed.test.ts, tests/unit/mixed.test.ts]
        filesSkipped: []
        oldPath: tests/mixed.test.ts
        newPath: tests/unit/mixed.test.ts
        typeErrorCount: 1
        typeErrorsTruncated: false
        typeErrors:
          - file: tests/unit/mixed.test.ts
            line: 1
            col: 26
            code: 2307
            message: "Cannot find module 'vitest' or its corresponding type declarations."
      files:
        moved:
          tests/mixed.test.ts:
            to: tests/unit/mixed.test.ts
            content: |
              import { describe } from "vitest";
              import { greetUser } from "../../src/utils";

  - name: keeps the .js extension when rewriting the moved file's own import
    given:
      extends: module-nobody-imports
      files:
        tests/js-ext.test.ts: |
          import { greetUser } from "../src/utils.js";
    when:
      - moveFile: { oldPath: tests/js-ext.test.ts, newPath: tests/unit/js-ext.test.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [tests/js-ext.test.ts, tests/unit/js-ext.test.ts]
        filesSkipped: []
        oldPath: tests/js-ext.test.ts
        newPath: tests/unit/js-ext.test.ts
      files:
        moved:
          tests/js-ext.test.ts:
            to: tests/unit/js-ext.test.ts
            content: |
              import { greetUser } from "../../src/utils.js";

  - name: leaves the moved file's imports alone when the rename stays at the same depth
    given:
      extends: module-nobody-imports
      files:
        tests/renamed.test.ts: |
          import { greetUser } from "../src/utils";
    when:
      - moveFile: { oldPath: tests/renamed.test.ts, newPath: tests/other.test.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [tests/other.test.ts]
        filesSkipped: []
        oldPath: tests/renamed.test.ts
        newPath: tests/other.test.ts
      files:
        moved:
          tests/renamed.test.ts: tests/other.test.ts

  - name: rewrites the .js specifier when the tsconfig resolves modules the node way
    description: >
      Under moduleResolution node a ./utils.js specifier resolves to utils.ts, so the
      move has to rewrite it rather than leave it as an unresolved literal.
    given:
      files:
        tsconfig.json: |
          {
            "compilerOptions": { "strict": true, "moduleResolution": "node" },
            "include": ["src/**/*.ts"]
          }
        src/utils.ts: |
          export function greetUser(name: string): string {
            return `Hello, ${name}`;
          }
        src/consumer.ts: |
          import { greetUser } from "./utils.js";

          export { greetUser };
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
    then:
      response:
        status: success
        typeErrors: none
        filesModified: [src/consumer.ts, lib/utils.ts]
        filesSkipped: []
        oldPath: src/utils.ts
        newPath: lib/utils.ts
      files:
        moved:
          src/utils.ts: lib/utils.ts
        changed:
          src/consumer.ts: |
            import { greetUser } from "../lib/utils.js";

            export { greetUser };

  - name: moving a file back restores the importer to its original specifier
    given: module-with-importers
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
      - moveFile: { oldPath: lib/utils.ts, newPath: src/utils.ts }
    then:
      files:
        unchanged: [tsconfig.json, src/utils.ts, src/main.ts, tests/utils.test.ts]

  - name: two out-of-project files move in turn and the importer follows both
    given:
      extends: ts-project
      files:
        tests/helper.ts: |
          export function help(): number {
            return 42;
          }
        tests/consumer.test.ts: |
          import { help } from "./helper";

          console.log(help());
    when:
      - moveFile: { oldPath: tests/helper.ts, newPath: lib/helper.ts }
      - moveFile: { oldPath: tests/consumer.test.ts, newPath: tests/unit/consumer.test.ts }
    then:
      files:
        moved:
          tests/helper.ts: lib/helper.ts
          tests/consumer.test.ts:
            to: tests/unit/consumer.test.ts
            content: |
              import { help } from "../../lib/helper";

              console.log(help());
        unchanged: [tsconfig.json]

  - name: the fallback scan repoints an out-of-project importer on the second move
    given:
      extends: module-nobody-imports
      files:
        src/main.ts: |
          import { greetUser } from "./utils";

          export { greetUser };
        scripts/run.ts: |
          import { greetUser } from "../src/main";

          console.log(greetUser("world"));
    when:
      - moveFile: { oldPath: src/utils.ts, newPath: lib/utils.ts }
      - moveFile: { oldPath: src/main.ts, newPath: dist/main.ts }
    then:
      files:
        moved:
          src/utils.ts: lib/utils.ts
          src/main.ts:
            to: dist/main.ts
            content: |
              import { greetUser } from "../lib/utils";

              export { greetUser };
        changed:
          scripts/run.ts: |
            import { greetUser } from "../dist/main";

            console.log(greetUser("world"));
