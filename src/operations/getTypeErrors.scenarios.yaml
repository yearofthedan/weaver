# Fixtures name the one axis each scenario turns on: which files a tsconfig's
# include/exclude puts in or out of a project-wide type check.
fixtures:
  a-scoped-ts-project:
    description: >
      A tsconfig scoping to src, a clean file inside it, and a type error in a test file
      the tsconfig excludes.
    files:
      tsconfig.json: |
        {
          "compilerOptions": { "strict": true },
          "include": ["src"]
        }
      src/ok.ts: |
        export const value: number = 1;
      tests/broken.test.ts: |
        const broken: number = "not a number";

  a-scoped-ts-project-with-sibling-config:
    description: >
      a-scoped-ts-project plus a sibling tsconfig.test.json covering the tests/ directory
      the root tsconfig excludes, so a check can be pointed at either one by name.
    extends: a-scoped-ts-project
    files:
      tsconfig.test.json: |
        {
          "compilerOptions": { "strict": true },
          "include": ["tests"]
        }

  a-vue-scoped-project:
    description: >
      A Vue tsconfig scoping to src (.ts and .vue), with skipLibCheck off so a dependency's
      own type declarations get checked the way tsc checks them.
    files:
      tsconfig.json: |
        {
          "compilerOptions": {
            "strict": true,
            "skipLibCheck": false,
            "target": "ESNext",
            "module": "ESNext",
            "moduleResolution": "bundler",
            "jsx": "preserve"
          },
          "include": ["src/**/*.ts", "src/**/*.vue"]
        }

  an-esm-nodenext-import-meta-project:
    description: >
      An ESM package (package.json "type": "module") under module/moduleResolution NodeNext,
      whose only file uses import.meta.
    files:
      package.json: '{ "name": "meta-project", "type": "module" }'
      tsconfig.json: |
        {
          "compilerOptions": {
            "target": "ES2022",
            "module": "NodeNext",
            "moduleResolution": "NodeNext",
            "strict": true,
            "noEmit": true
          },
          "include": ["src/**/*"]
        }
      src/main.ts: |
        export const metaValue = import.meta;

  a-cjs-nodenext-import-meta-project:
    description: >
      Same tsconfig and source as an-esm-nodenext-import-meta-project, but no package.json
      "type" field — the file resolves as CommonJS, so import.meta stays an error.
    extends: an-esm-nodenext-import-meta-project
    files:
      package.json: '{ "name": "meta-project" }'

  an-esm-nodenext-extensionless-import-project:
    description: >
      An ESM package under NodeNext where main.ts imports a sibling without a file extension —
      the case a real build rejects, which ts-morph's own diagnostics used to miss entirely.
    files:
      package.json: '{ "name": "ext-project", "type": "module" }'
      tsconfig.json: |
        {
          "compilerOptions": {
            "target": "ES2022",
            "module": "NodeNext",
            "moduleResolution": "NodeNext",
            "strict": true,
            "noEmit": true
          },
          "include": ["src/**/*"]
        }
      src/helper.ts: |
        export const value = 1;
      src/main.ts: |
        import { value } from "./helper";
        export const doubled = value * 2;

  a-mixed-extension-nodenext-project:
    description: >
      No package.json "type" field (so CommonJS is the default), with one .mts file and one
      .cts file — the file extension pins each file's format regardless of that default.
    files:
      package.json: '{ "name": "mixed" }'
      tsconfig.json: |
        {
          "compilerOptions": {
            "target": "ES2022",
            "module": "NodeNext",
            "moduleResolution": "NodeNext",
            "strict": true,
            "noEmit": true
          },
          "include": ["src/**/*"]
        }
      src/esm.mts: |
        export const x = import.meta;
      src/cjs.cts: |
        export const y = import.meta;

  a-vue-nodenext-import-meta-project:
    description: A Vue project under NodeNext, in an ESM package, whose SFC uses import.meta.
    files:
      package.json: '{ "name": "vue-meta", "type": "module" }'
      tsconfig.json: |
        {
          "compilerOptions": {
            "target": "ES2022",
            "module": "NodeNext",
            "moduleResolution": "NodeNext",
            "strict": true,
            "jsx": "preserve",
            "noEmit": true
          },
          "include": ["src/**/*.ts", "src/**/*.vue"]
        }
      src/App.vue: |
        <script setup lang="ts">
        const x = import.meta;
        </script>
        <template><div>App</div></template>

  a-vue-nodenext-extensionless-import-project:
    description: >
      A Vue project under NodeNext, in an ESM package, where both a .ts file and an SFC import
      the same sibling without a file extension.
    files:
      package.json: '{ "name": "vue-ext", "type": "module" }'
      tsconfig.json: |
        {
          "compilerOptions": {
            "target": "ES2022",
            "module": "NodeNext",
            "moduleResolution": "NodeNext",
            "strict": true,
            "jsx": "preserve",
            "noEmit": true
          },
          "include": ["src/**/*.ts", "src/**/*.vue"]
        }
      src/helper.ts: |
        export const value = 1;
      src/main.ts: |
        import { value } from "./helper";
        export const doubled = value * 2;
      src/App.vue: |
        <script setup lang="ts">
        import { value } from "./helper";
        const doubled = value * 2;
        </script>
        <template><div>{{ doubled }}</div></template>

  a-vue-nodenext-mixed-case-dir-project:
    description: >
      A Vue project under NodeNext whose extensionless import names a sibling inside a
      mixed-case directory, so the suggested extension can only be found by probing the
      path with its casing intact.
    files:
      package.json: '{ "name": "vue-case", "type": "module" }'
      tsconfig.json: |
        {
          "compilerOptions": {
            "target": "ES2022",
            "module": "NodeNext",
            "moduleResolution": "NodeNext",
            "strict": true,
            "jsx": "preserve",
            "noEmit": true
          },
          "include": ["src/**/*.ts", "src/**/*.vue"]
        }
      src/Nested/helper.ts: |
        export const value = 1;
      src/main.ts: |
        import { value } from "./Nested/helper";
        export const doubled = value * 2;
      src/App.vue: |
        <template><div>App</div></template>

  a-vue-nodenext-mts-project:
    description: >
      A Vue project with no package.json "type" field, containing an .mts file whose extension
      pins it to ESM despite the CommonJS default, alongside an unrelated SFC.
    files:
      package.json: '{ "name": "vue-mts" }'
      tsconfig.json: |
        {
          "compilerOptions": {
            "target": "ES2022",
            "module": "NodeNext",
            "moduleResolution": "NodeNext",
            "strict": true,
            "jsx": "preserve",
            "noEmit": true
          },
          "include": ["src/**/*.ts", "src/**/*.mts", "src/**/*.vue"]
        }
      src/main.mts: |
        export const x = import.meta;
      src/App.vue: |
        <script setup lang="ts">
        </script>
        <template><div>App</div></template>

  a-vue-project-scoping-to-src:
    description: >
      A Vue tsconfig whose include reaches only src/, with an SFC under src/ making the workspace a
      Vue project. A file under dist/ sits outside both seeds of the Volar program — the tsconfig's
      own file set and the workspace walk, which skips dist/ — so nothing puts it in the program
      until a check asks for it by name.
    files:
      tsconfig.json: |
        {
          "compilerOptions": {
            "strict": true,
            "target": "ESNext",
            "module": "ESNext",
            "moduleResolution": "bundler",
            "jsx": "preserve",
            "noEmit": true
          },
          "include": ["src/**/*"]
        }
      src/App.vue: |
        <script setup lang="ts">
        </script>

        <template>
          <div>App</div>
        </template>

  a-ts-only-project-scoping-to-src:
    description: >
      The same tsconfig with no .vue file anywhere in the workspace, so an identical input routes
      to the ts-morph engine instead of Volar.
    files:
      tsconfig.json: |
        {
          "compilerOptions": {
            "strict": true,
            "target": "ESNext",
            "module": "ESNext",
            "moduleResolution": "bundler",
            "jsx": "preserve",
            "noEmit": true
          },
          "include": ["src/**/*"]
        }

  a-vue-project-with-an-out-of-program-ts-file:
    description: a-vue-project-scoping-to-src plus a .ts file under dist/ whose declaration rejects its initializer
    extends: a-vue-project-scoping-to-src
    files:
      dist/gen.ts: |
        export const n: number = "not-a-number";

  a-ts-only-project-with-an-out-of-program-ts-file:
    description: the same dist/ file in the workspace with no .vue file
    extends: a-ts-only-project-scoping-to-src
    files:
      dist/gen.ts: |
        export const n: number = "not-a-number";

  a-vue-project-checking-a-file-its-rootDir-excludes:
    description: >
      a-vue-project-scoping-to-src with rootDir/outDir naming a build layout the checked file sits
      outside. ts-morph reports TS6059 among the compiler-option diagnostics for that shape; a
      check that reads semantic diagnostics must carry the file's own error and no TS6059.
    extends: a-vue-project-scoping-to-src
    files:
      tsconfig.json: |
        {
          "compilerOptions": {
            "strict": true,
            "target": "ESNext",
            "module": "ESNext",
            "moduleResolution": "bundler",
            "jsx": "preserve",
            "noEmit": true,
            "rootDir": "src",
            "outDir": "dist"
          },
          "include": ["src/**/*"]
        }
      dist/gen.ts: |
        export const n: number = "not-a-number";

  a-vue-project-with-an-out-of-program-sfc:
    description: a-vue-project-scoping-to-src plus an SFC under dist/ whose script rejects its initializer
    extends: a-vue-project-scoping-to-src
    files:
      dist/Broken.vue: |
        <script setup lang="ts">
        const x: number = "not a number";
        </script>

        <template>
          <div>{{ x }}</div>
        </template>

  a-vue-project-with-an-in-program-sfc:
    description: >
      The same broken SFC as a-vue-project-with-an-out-of-program-sfc, placed under src/ so the
      tsconfig's include puts it in the program before any check asks for it.
    extends: a-vue-project-scoping-to-src
    files:
      src/Broken.vue: |
        <script setup lang="ts">
        const x: number = "not a number";
        </script>

        <template>
          <div>{{ x }}</div>
        </template>

  a-vue-project-with-out-of-program-module-files:
    description: >
      a-vue-project-scoping-to-src plus one .mts and one .cts file under dist/, each rejecting its
      initializer.
    extends: a-vue-project-scoping-to-src
    files:
      dist/esm.mts: |
        export const x: number = "not a number";
      dist/cjs.cts: |
        export const x: number = "not a number";

  a-ts-only-project-with-out-of-program-module-files:
    description: the same two dist/ module files in the workspace with no .vue file
    extends: a-ts-only-project-scoping-to-src
    files:
      dist/esm.mts: |
        export const x: number = "not a number";
      dist/cjs.cts: |
        export const x: number = "not a number";

  a-vue-project-with-an-out-of-program-ts-file-importing-an-sfc:
    description: >
      a-vue-project-scoping-to-src plus a .ts file under dist/ that imports the SFC and has an
      unrelated error of its own.
    extends: a-vue-project-scoping-to-src
    files:
      dist/importsSfc.ts: |
        import App from "../src/App.vue";

        export const broken: number = "not a number";

        console.log(App);

  a-vue-project-with-an-in-program-ts-file-importing-an-sfc:
    description: >
      The same file as a-vue-project-with-an-out-of-program-ts-file-importing-an-sfc, placed under
      src/ beside the SFC so both are already in the program.
    extends: a-vue-project-scoping-to-src
    files:
      src/importsSfc.ts: |
        import App from "./App.vue";

        export const broken: number = "not a number";

        console.log(App);

  a-vue-project-importing-an-out-of-program-sfc:
    description: >
      a-vue-project-with-an-out-of-program-sfc plus an included file that imports it — the SFC is
      in neither of the Volar program's seeds, but a real build reaches it through the compiler's
      own module resolution.
    extends: a-vue-project-with-an-out-of-program-sfc
    files:
      src/main.ts: |
        import B from "../dist/Broken.vue";

        export const b = B;

  a-vue-project-importing-a-missing-sfc:
    description: >
      The same shape with no SFC at the imported path — a missing `.vue` specifier has to keep
      reporting what a missing import always reported.
    extends: a-vue-project-scoping-to-src
    files:
      src/main.ts: |
        import B from "../dist/Missing.vue";

        export const b = B;

  a-vue-project-importing-a-dependency-sfc:
    description: >
      a-vue-project-scoping-to-src plus an included file importing an SFC shipped by a dependency.
      node_modules is outside the workspace walk and the `.vue` scan skips it, so the SFC is in
      neither seed.
    extends: a-vue-project-scoping-to-src
    files:
      node_modules/comp/Comp.vue: |
        <script setup lang="ts">
        const x: number = "not a number";
        </script>

        <template>
          <div>{{ x }}</div>
        </template>
      src/main.ts: |
        import Comp from "comp/Comp.vue";

        export const c = Comp;

  a-vue-project-with-an-ignored-sfc:
    description: >
      a-vue-project-scoping-to-src plus a broken SFC in tests/, which the tsconfig's include leaves
      out but the on-disk `.vue` scan reaches — tests/ is ignored, not skipped.
    extends: a-vue-project-scoping-to-src
    files:
      tests/Broken.vue: |
        <script setup lang="ts">
        const x: number = "not a number";
        </script>

        <template>
          <div>{{ x }}</div>
        </template>

scenarios:
  - name: a project-wide check reports nothing for an error outside the tsconfig's include
    given: a-scoped-ts-project
    when:
      - getTypeErrors: {}
    then:
      response:
        status: success
        errorCount: 0
        diagnostics: []
        truncated: false
        checked:
          files: 1
          tsconfig: tsconfig.json
        unchecked:
          files: 1
          reason: "outside tsconfig.json"
          otherConfigs: []

  - name: a project-wide check still reports an error in a file outside include that an included file imports
    description: >
      lib/helper.ts sits outside the tsconfig's include, but src/main.ts (inside include) imports it, so a
      real build type-checks it too — this pins that the narrowing follows the compiler's own module
      resolution rather than a plain filter to include's raw file list, which would silently miss it.
    given:
      description: a tsconfig scoping to src, whose only file imports a broken sibling outside that scope
      extends: a-scoped-ts-project
      files:
        src/main.ts: |
          import { broken } from "../lib/helper";

          console.log(broken);
        lib/helper.ts: |
          export const broken: number = "not a number";
    when:
      - getTypeErrors: {}
    then:
      response:
        status: success
        errorCount: 1
        truncated: false
        diagnostics:
          - file: lib/helper.ts
            line: 1
            col: 14
            code: 2322
            message: "Type 'string' is not assignable to type 'number'."
        checked:
          files: 3
          tsconfig: tsconfig.json
        unchecked:
          files: 1
          reason: "outside tsconfig.json"
          otherConfigs: []

  - name: a project-wide check on a workspace with no tsconfig still reports a walked file's error
    description: >
      With no tsconfig there is no program to defer to, so the workspace walk is the only file set —
      narrowing to a nonexistent tsconfig scope would silently report a clean bill of health instead.
    given:
      description: a workspace with a type error and no tsconfig.json anywhere in it
      files:
        src/broken.ts: |
          const broken: number = "not a number";
    when:
      - getTypeErrors: {}
    then:
      response:
        status: success
        errorCount: 1
        truncated: false
        diagnostics:
          - file: src/broken.ts
            line: 1
            col: 7
            code: 2322
            message: "Type 'string' is not assignable to type 'number'."
        checked:
          files: 1
          tsconfig: null
        unchecked:
          files: 0
          reason: "no tsconfig"
          otherConfigs: []

  - name: a Vue project-wide check still reports an error in a file outside include that an included file imports
    description: >
      Same shape as the ts-morph closure scenario above, but on a Vue project — lib/helper.ts sits
      outside the tsconfig's include, but src/main.ts (inside include) imports it, so a real build
      type-checks it too. Pins that the Vue engine follows the compiler's own module resolution the
      same way the ts-morph engine does, rather than reporting a false clean bill of health.
    given:
      description: >
        a Vue tsconfig scoping to src, with an SFC, and a .ts file that imports a broken sibling
        outside that scope
      extends: a-vue-scoped-project
      files:
        src/App.vue: |
          <script setup lang="ts">
          </script>

          <template>
            <div>App</div>
          </template>
        src/main.ts: |
          import { helper } from "../lib/helper.js";

          console.log(helper);
        lib/helper.ts: |
          export const helper: number = "SENTINEL";
    when:
      - getTypeErrors: {}
    then:
      response:
        status: success
        errorCount: 1
        truncated: false
        diagnostics:
          - file: lib/helper.ts
            line: 1
            col: 14
            code: 2322
            message: "Type 'string' is not assignable to type 'number'."
        checked:
          files: 3
          tsconfig: tsconfig.json
        unchecked:
          files: 0
          reason: "outside tsconfig.json"
          otherConfigs: []

  - name: a project-wide check reports an error in a dependency's own type declarations when skipLibCheck is off
    description: >
      badpkg ships a .d.ts with its own type error. tsc -p tsconfig.json checks it because
      skipLibCheck is false, and the closure walk reaches it through main.ts's import even
      though node_modules sits outside the workspace walk that widens the project for
      rename/find-references — pins that project-wide diagnostics follow the compiler's own
      module resolution, not the walk.
    given:
      description: >
        a tsconfig with skipLibCheck off, and a workspace file importing a dependency whose
        own .d.ts has a type error
      files:
        tsconfig.json: |
          {
            "compilerOptions": { "strict": true, "skipLibCheck": false },
            "include": ["src"]
          }
        node_modules/badpkg/package.json: |
          {"name":"badpkg","version":"1.0.0","types":"index.d.ts"}
        node_modules/badpkg/index.d.ts: |
          export declare const fromDependency: number = "SENTINEL";
        src/main.ts: |
          import { fromDependency } from "badpkg";

          console.log(fromDependency);
    when:
      - getTypeErrors: {}
    then:
      response:
        status: success
        errorCount: 2
        truncated: false
        diagnostics:
          - file: node_modules/badpkg/index.d.ts
            line: 1
            col: 22
            code: 2322
            message: "Type 'string' is not assignable to type 'number'."
          - file: node_modules/badpkg/index.d.ts
            line: 1
            col: 47
            code: 1039
            message: "Initializers are not allowed in ambient contexts."
        checked:
          files: 1
          tsconfig: tsconfig.json
        unchecked:
          files: 0
          reason: "outside tsconfig.json"
          otherConfigs: []

  - name: a Vue project-wide check reports an error in a dependency's own type declarations when skipLibCheck is off
    description: >
      Same shape as the ts-morph dependency scenario above, but on a Vue project — pins that
      the Vue engine's closure walk reaches node_modules the same way the ts-morph engine's
      does, rather than only visiting the files the workspace walk already found.
    given:
      description: >
        a Vue tsconfig with skipLibCheck off, and a workspace file importing a dependency
        whose own .d.ts has a type error
      extends: a-vue-scoped-project
      files:
        node_modules/badpkg/package.json: |
          {"name":"badpkg","version":"1.0.0","types":"index.d.ts"}
        node_modules/badpkg/index.d.ts: |
          export declare const fromDependency: number = "SENTINEL";
        src/App.vue: |
          <script setup lang="ts">
          </script>

          <template>
            <div>App</div>
          </template>
        src/main.ts: |
          import { fromDependency } from "badpkg";

          console.log(fromDependency);
    when:
      - getTypeErrors: {}
    then:
      response:
        status: success
        errorCount: 2
        truncated: false
        diagnostics:
          - file: node_modules/badpkg/index.d.ts
            line: 1
            col: 22
            code: 2322
            message: "Type 'string' is not assignable to type 'number'."
          - file: node_modules/badpkg/index.d.ts
            line: 1
            col: 47
            code: 1039
            message: "Initializers are not allowed in ambient contexts."
        checked:
          files: 2
          tsconfig: tsconfig.json
        unchecked:
          files: 0
          reason: "outside tsconfig.json"
          otherConfigs: []

  - name: a project-wide check on a Vue workspace reports only the SFC error, not one outside include
    given:
      description: >
        a Vue tsconfig scoping to src, a broken SFC inside it, and a broken test file the tsconfig
        excludes
      files:
        tsconfig.json: |
          {
            "compilerOptions": {
              "strict": true,
              "target": "ESNext",
              "module": "ESNext",
              "moduleResolution": "bundler",
              "jsx": "preserve"
            },
            "include": ["src"]
          }
        src/Broken.vue: |
          <script setup lang="ts">
          const x: number = "not a number";
          </script>

          <template>
            <div>{{ x }}</div>
          </template>
        tests/broken.test.ts: |
          const broken: number = "not a number";
    when:
      - getTypeErrors: {}
    then:
      response:
        status: success
        errorCount: 1
        truncated: false
        diagnostics:
          - file: src/Broken.vue
            line: 2
            col: 7
            code: 2322
            message: "Type 'string' is not assignable to type 'number'."
        checked:
          files: 1
          tsconfig: tsconfig.json
        unchecked:
          files: 1
          reason: "outside tsconfig.json"
          otherConfigs: []

  - name: a project-wide check names the sibling tsconfig covering an excluded file
    description: >
      tsconfig.test.json covers tests/, but get-type-errors with no tsconfig argument answers
      for tsconfig.json alone — the excluded file's own config is named in otherConfigs rather
      than silently checked too.
    given: a-scoped-ts-project-with-sibling-config
    when:
      - getTypeErrors: {}
    then:
      response:
        status: success
        errorCount: 0
        diagnostics: []
        truncated: false
        checked:
          files: 1
          tsconfig: tsconfig.json
        unchecked:
          files: 1
          reason: "outside tsconfig.json"
          otherConfigs:
            - tsconfig.test.json

  - name: a project-wide check answers for a named tsconfig instead of the discovered one
    description: >
      tsconfig.json (the discovered default) excludes tests/, but naming tsconfig.test.json
      directly answers for that config's own program instead — the excluded file's error
      surfaces, and checked.tsconfig names the config that actually answered.
    given: a-scoped-ts-project-with-sibling-config
    when:
      - getTypeErrors: { tsconfig: tsconfig.test.json }
    then:
      response:
        status: success
        errorCount: 1
        truncated: false
        diagnostics:
          - file: tests/broken.test.ts
            line: 1
            col: 7
            code: 2322
            message: "Type 'string' is not assignable to type 'number'."
        checked:
          files: 1
          tsconfig: tsconfig.test.json
        unchecked:
          files: 1
          reason: "outside tsconfig.test.json"
          otherConfigs:
            - tsconfig.json

  - name: a project-wide check resolves a nested tsconfig path against the workspace root
    description: >
      The tsconfig argument sits in a subdirectory, not the workspace root — pins that
      resolution joins it against the workspace, not against wherever the process
      calling in happens to be, which a bare filename can't tell apart from.
    given:
      description: >
        a-scoped-ts-project plus a tsconfig nested under config/ that covers tests/ via a
        relative include
      extends: a-scoped-ts-project
      files:
        config/tsconfig.nested.json: |
          {
